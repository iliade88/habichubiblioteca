<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script type="module" src="./script.js"></script>
</head>
<body>
    <header>
        <h1>Mi Biblioteca Personal</h1>
    </header>

    <main>
        <section id="search-section">
            <h2>Buscar Libros</h2>
            <input type="text" id="search-input" placeholder="Título, Autor, ISBN...">
            <button id="search-button">Buscar</button>
            <div id="search-results"></div>
        </section>

        <section id="add-book-section">
            <h2>Añadir Nuevo Libro</h2>
            <button id="show-add-form-button">Añadir Libro Manualmente</button>
            <form id="add-book-form" style="display: none;">
                <label for="title">Título:</label>
                <input type="text" id="title" required><br><br>

                <label for="author">Autor:</label>
                <input type="text" id="author"><br><br>

                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn"><br><br>

                <label for="status">Estado:</label>
                <select id="status">
                    <option value="en-posesion">En posesión <i class="fas fa-check-circle"></i></option>
                    <option value="lo-quiero">Lo quiero <i class="fas fa-heart"></i></option>
                </select><br><br>

                <button type="button" id="add-book-manual-button">Guardar Libro</button>
            </form>
        </section>

        <section id="library-section">
            <h2>Mi Biblioteca</h2>
            <div id="library-list"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Mi Biblioteca Personal</p>
    </footer>
</body>
</html>
