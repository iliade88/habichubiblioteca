<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="./script.js"></script>
</head>
<body>
    <header>
        <h1>Mi Biblioteca Personal</h1>
        <nav>
            <ul>
                <li><a href="#library-section" id="nav-library"><i class="fas fa-book"></i> Mi Biblioteca</a></li>
                <li><a href="#search-section" id="nav-search"><i class="fas fa-search"></i> Buscador</a></li>
                <li><a href="#add-book-section" id="nav-add-book"><i class="fas fa-plus"></i> Añadir Nuevo Libro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="library-section" class="page-section">
            <h2>Mi Biblioteca</h2>
            <input type="text" id="filter-input" placeholder="Filtrar por título, autor, ISBN...">
            <div id="library-list"></div>
        </section>

        <section id="search-section" class="page-section" style="display: none;">
            <h2>Buscador</h2>
            <input type="text" id="search-input" placeholder="Título, Autor, ISBN...">
            <button id="search-button">Buscar</button>
            <div id="search-results"></div>
        </section>

        <section id="add-book-section" class="page-section" style="display: none;">
            <h2>Añadir Nuevo Libro</h2>
            <form id="add-book-form">
                <label for="title">Título:</label>
                <input type="text" id="title" required><br><br>

                <label for="author">Autor:</label>
                <input type="text" id="author"><br><br>

                <label for="isbn">ISBN:</label>
                <input type="text" id="isbn"><br><br>

                <label for="status">Estado:</label>
                <select id="status">
                    <option value="en-posesion">En posesión</option>
                    <option value="lo-quiero">Lo quiero</option>
                </select><br><br>

                <button type="button" id="add-book-manual-button">Guardar Libro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Mi Biblioteca Personal</p>
    </footer>
</body>
</html>
